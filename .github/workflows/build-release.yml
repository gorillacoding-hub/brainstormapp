name: Build APK and GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android project
        run: |
          npx cap add android

      - name: Add native full-view support
        run: |
          TARGET=android/app/src/main/java/com/gorillacoding/filament/MainActivity.java
          test -f "$TARGET"
          cp native/MainActivity.java "$TARGET"
          npx cap sync android

      - name: Set app version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${TAG#v}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS_PASS="$KEYSTORE_PASSWORD"; K_ALIAS="$KEY_ALIAS"; K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No signing secrets set - using a throwaway key. Add the secrets for updatable installs."
            KS_PASS=android; K_ALIAS=filament; K_PASS=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$K_ALIAS" \
              -storepass "$KS_PASS" -keypass "$K_PASS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Filament"
          fi

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KS_PASS" K_PASS="$K_PASS" "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$K_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --out "Filament-${TAG}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "Filament-${TAG}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "Filament-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "Filament $TAG" \
            --generate-notes
